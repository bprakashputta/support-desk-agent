<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support Desk · Inbox</title>
<meta name="description" content="A customer-support agent that takes real actions behind code-enforced policy, human approval and an audit log.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5.5 5h13L21 13v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5z"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.6-7 9-4-1.4-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></symbol>
    <symbol id="i-handoff" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 8h5m-2-2 2 2-2 2"/></symbol>
    <symbol id="i-log" viewBox="0 0 24 24"><path d="M6 4h10a2 2 0 0 1 2 2v14l-3-2-3 2-3-2-3 2V6a2 2 0 0 1 2-2z"/><path d="M8.5 9h6M8.5 13h4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-tool" viewBox="0 0 24 24"><path d="M14.5 6.5a4 4 0 0 0 5 5L12 19a2.1 2.1 0 0 1-3-3l7.5-7.5"/><path d="M14.5 6.5L17 4l3 3-2.5 2.5"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-8l-4 3.5V16H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 5.5A1.5 1.5 0 0 1 6.5 4H19v14H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="M4 7.5L12 4l8 3.5v9L12 20l-8-3.5z"/><path d="M4 7.5l8 3.5 8-3.5M12 11v9"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c0-3.6 3.1-6.5 7-6.5s7 2.9 7 6.5"/></symbol>
    <symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="2.5"/><path d="M5 6v12c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5V6M5 12c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  </defs>
</svg>

<div class="app">
  <nav class="rail" aria-label="Workspace">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-8l-4 3.5V16H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/><path d="M8.5 10.5l2.3 2.3 4.7-4.6"/></svg></span>
    <div class="tabs" role="tablist" aria-label="Views">
      <button role="tab" aria-selected="true" data-tab="trace"><svg class="ic"><use href="#i-inbox"/></svg><span class="tl">Inbox</span></button>
      <button role="tab" aria-selected="false" data-tab="approvals"><svg class="ic"><use href="#i-shield"/></svg><span class="tl">Approvals</span><span class="count" id="n-appr"></span></button>
      <button role="tab" aria-selected="false" data-tab="tickets"><svg class="ic"><use href="#i-handoff"/></svg><span class="tl">Handoffs</span><span class="count neutral" id="n-tix"></span></button>
      <button role="tab" aria-selected="false" data-tab="audit"><svg class="ic"><use href="#i-log"/></svg><span class="tl">Audit log</span></button>
    </div>
  </nav>

  <aside class="list" aria-labelledby="list-h">
    <div class="list-head">
      <h1 id="list-h">Inbox</h1>
      <button class="btn primary sm" id="new-thread" type="button"><svg class="ic"><use href="#i-plus"/></svg>New conversation</button>
      <p class="list-sub" id="list-sub">Conversations</p>
    </div>
    <ul class="threads" id="threads" aria-label="Conversations"></ul>
    <div class="list-foot" id="meta">connecting…</div>
  </aside>

  <main class="main">
    <section class="view inbox" id="tab-inbox" role="tabpanel" aria-labelledby="conv-h">
      <header class="conv-head">
        <div class="conv-title">
          <h2 id="conv-h">Conversation</h2>
          <p class="conv-meta" id="thread-id"></p>
        </div>
        <span id="conv-status"></span>
      </header>
      <ol class="messages" id="messages" aria-live="polite"></ol>
      <form class="composer" id="composer">
        <label class="composer-label" for="input">Reply as the customer <span>· demo: you play the shopper, the AI agent answers</span></label>
        <div class="composer-box">
          <textarea id="input" rows="2" placeholder="e.g. I want to cancel an order" required></textarea>
          <button class="btn primary" id="send" type="submit"><svg class="ic"><use href="#i-send"/></svg>Send</button>
        </div>
      </form>
      <details class="examples" id="examples">
        <summary><svg class="ic chev"><use href="#i-chev"/></svg>Synthetic customers to try (tau-bench data)</summary>
        <div id="example-list"></div>
      </details>
    </section>
    <section class="view" id="tab-approvals" role="tabpanel" hidden></section>
    <section class="view" id="tab-tickets" role="tabpanel" hidden></section>
    <section class="view" id="tab-audit" role="tabpanel" hidden></section>
  </main>

  <aside class="side" aria-label="Conversation details">
    <section class="panel" id="customer-card"></section>
    <div id="pending-card"></div>
    <section class="panel" id="orders-card"></section>
    <details class="panel activity" open>
      <summary><svg class="ic chev"><use href="#i-chev"/></svg><span>Activity</span><span class="pill-count" id="n-steps"></span></summary>
      <ol class="timeline" id="tab-trace"></ol>
    </details>
  </aside>
</div>
<script src="/static/app.js"></script>
</body>
</html>
